name: Keepalive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend keepalive endpoint
        run: |
          curl -sf --retry 3 --retry-delay 5 \
            "https://alexisplescia.onrender.com/api/keepalive?token=${{ secrets.KEEPALIVE_TOKEN }}"
